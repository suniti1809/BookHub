<!DOCTYPE html>
<html>
<head>
    <title>Registration</title>
</head>

<body bgcolor="lightcyan">
    <center>

        <h2>Registration Form</h2>

        <form>
            <table cellspacing="8">
                
                <tr>
                    <td align="right">Name:</td>
                    <td><input type="text" size="30"></td>
                </tr>

                <tr>
                    <td align="right">Password:</td>
                    <td><input type="password" size="30"></td>
                </tr>

                <tr>
                    <td align="right">Email:</td>
                    <td><input type="email" size="30"></td>
                </tr>

                <tr>
                    <td align="right">Phone:</td>
                    <td><input type="text" size="30"></td>
                </tr>

                <tr>
                    <td align="right">Gender:</td>
                    <td>
                        <input type="radio" name="g">Male
                        <input type="radio" name="g">Female
                        <input type="radio" name="g">Other
                    </td>
                </tr>

                <tr>
                    <td align="right">Date of Birth:</td>
                    <td><input type="date"></td>
                </tr>
                
                <tr>
                    <td align="right">Languages Known:</td>
                    <td>
                        <input type="checkbox" name="lang">English
                        <input type="checkbox" name="lang">Hindi
                        <input type="checkbox" name="lang">Other
                    </td>
                </tr>

                <tr>
                    <td align="right">Address:</td>
                    <td><textarea rows="3" cols="28"></textarea></td>
                </tr>


                <tr>
                    <td colspan="2" align="center">
                        <input type="submit" value="Register">
                        <input type="reset" value="Clear">
                    </td>
                </tr>

            </table>
        </form>

        <p>
            Already have an account?
            <a href="login.html">Login here</a><br>
            <a href="home.html">Back to Homepage</a>
        </p>

    </center>
</body>
</html>
